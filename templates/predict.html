{% extends "base.html" %}
{% block content %}

<div class="container">
    <h2>Heart Disease Prediction</h2>
    <p class="subtitle">Enter patient clinical parameters</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">

        <label>Age (years)</label>
        <input type="number" name="age" min="1" max="120" placeholder="e.g., 63" required>

        <label>Gender</label>
        <select name="sex" required>
            <option value="">Select</option>
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select>

        <label>Chest Pain Type</label>
        <select name="cp" required>
            <option value="">Select</option>
            <option value="0">Typical Angina</option>
            <option value="1">Atypical Angina</option>
            <option value="2">Non-anginal Pain</option>
            <option value="3">Asymptomatic</option>
        </select>

        <label>Resting Blood Pressure (mm Hg)</label>
        <input type="number" name="trestbps" min="50" max="250" placeholder="e.g., 145" required>

        <label>Serum Cholesterol (mg/dl)</label>
        <input type="number" name="chol" min="100" max="600" placeholder="e.g., 233" required>

        <label>Fasting Blood Sugar > 120 mg/dl</label>
        <select name="fbs" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Resting ECG Results</label>
        <select name="restecg" required>
            <option value="">Select</option>
            <option value="0">Normal</option>
            <option value="1">ST-T Wave Abnormality</option>
            <option value="2">Left Ventricular Hypertrophy</option>
        </select>

        <label>Maximum Heart Rate Achieved (bpm)</label>
        <input type="number" name="thalach" min="60" max="220" placeholder="e.g., 150" required>

        <label>Exercise Induced Angina</label>
        <select name="exang" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>ST Depression (Oldpeak)</label>
        <input type="number" name="oldpeak" min="0" max="10" step="0.1" placeholder="e.g., 2.3" required>

        <label>Slope of Peak Exercise ST Segment</label>
        <select name="slope" required>
            <option value="">Select</option>
            <option value="0">Upsloping</option>
            <option value="1">Flat</option>
            <option value="2">Downsloping</option>
        </select>

        <label>Number of Major Vessels (0-3)</label>
        <select name="ca" required>
            <option value="">Select</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>

        <label>Thalassemia</label>
        <select name="thal" required>
            <option value="">Select</option>
            <option value="1">Normal</option>
            <option value="2">Fixed Defect</option>
            <option value="3">Reversible Defect</option>
        </select>

        <button type="submit">🔬 Predict Risk</button>
    </form>

    <p class="subtitle" style="margin-top:20px; font-size:12px; color:#666;">
        <strong>Note:</strong> This is a prediction tool and should not replace professional medical diagnosis.
    </p>
</div>

{% endblock %}
