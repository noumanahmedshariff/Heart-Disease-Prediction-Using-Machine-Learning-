{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Login</h2>
    <p class="subtitle">Heart Disease Prediction System</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button>Login</button>
    </form>

    <p class="subtitle">
        New user? <a href="{{ url_for('register') }}">Register here</a>
    </p>
</div>
{% endblock %}
